[tox]
envlist = code,flake8,docs,docs-linkcheck
minversion = 4.0
skipsdist = true

[testenv:code]
basepython = python3
deps =
    pytest
    coverage
    pytest-cov
    # Project runtime dependencies (mirrors setup.py install_requires) so
    # 'import' statements in tests/conftest.py and tests/*.py resolve in
    # the tox virtualenv without relying on the legacy Jenkins runner's
    # global site-packages.
    ricxappframe==3.2.2
    # Pin pandas/scikit-learn/numpy to the major-version line current when
    # the legacy tests were last green under Jenkins. The bleeding-edge
    # versions (pandas 3.x, scikit-learn 1.8+, numpy 2.x) install fine but
    # break the project's existing test code via API changes:
    #   - sklearn 1.8 _safe_indexing rejects 'String indexing ... axis=0'
    #     in test_trainModel / test_predict_anomaly
    #   - pandas 3 / numpy 2 introduce incidental dtype changes that also
    #     break the same tests
    # The right long-term fix is updating tests to the new APIs; for now
    # pin to preserve legacy behaviour so the docs-update topic does not
    # block on application-code modernisation.
    pandas<2
    scikit-learn<1.4
    numpy<2
    joblib>=0.3.2
    mdclogpy<=1.1.1
    schedule>=0.0.0
    influxdb

setenv =
    LD_LIBRARY_PATH = /usr/local/lib/:/usr/local/lib64
    PYTHONPATH = {toxinidir}:src
    RMR_SEED_RT = tests/fixtures/test_local.rt
    RMR_ASYNC_CONN = 0
    USE_FAKE_SDL = 1

commands =
    pytest -v --cov src --cov-report xml --cov-report term-missing --cov-report html --cov-fail-under=50
    coverage xml -i

[testenv:flake8]
basepython = python3
skip_install = true
deps = flake8
setenv =
    PYTHONPATH = {toxinidir}:src:/usr/lib/python3.7/site-packages/
commands = flake8 setup.py src tests

[flake8]
extend-ignore = E501,E741,E731

[testenv:clm]
# use pip to gather dependencies with versions for CLM analysis
whitelist_externals = sh
commands = sh -c 'pip freeze > requirements.txt'

# doc jobs
[testenv:docs]
basepython = python3.13
deps = -r{toxinidir}/docs/requirements-docs.txt
allowlist_externals = echo
commands =
    sphinx-build -b html -n -d {envtmpdir}/doctrees ./docs/ {toxinidir}/docs/_build/html
    echo "Generated docs available in {toxinidir}/docs/_build/html"

[testenv:docs-linkcheck]
ignore_outcome = true
basepython = python3.13
deps = -r{toxinidir}/docs/requirements-docs.txt
commands = sphinx-build -b linkcheck -d {envtmpdir}/doctrees ./docs/ {toxinidir}/docs/_build/linkcheck

